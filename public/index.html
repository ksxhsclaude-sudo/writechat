<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WriteChat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b141a; --panel: #111b21; --panel2: #202c33;
    --accent: #00a884; --accent2: #25d366; --text: #e9edef; --muted: #8696a0;
    --bubble-me: #005c4b; --bubble-them: #202c33;
  }
  html, body { height: 100%; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #auth { width: 360px; max-width: 92vw; background: var(--panel);
    border-radius: 14px; padding: 32px 28px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  #auth h1 { font-size: 26px; margin-bottom: 4px; color: var(--accent2); }
  #auth p.sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid #2a3942;
    background: var(--panel2); color: var(--text); font-size: 14px; outline: none; }
  input:focus { border-color: var(--accent); }
  button.primary { width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button.primary:hover { background: #029b78; }
  button.primary:disabled { opacity: .6; cursor: default; }
  .toggle { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .toggle a { color: var(--accent2); cursor: pointer; text-decoration: none; }
  .msg-error { color: #ff6b6b; font-size: 13px; margin-top: 8px; min-height: 16px; }
  #app { display: none; width: 100%; height: 100%; }
  .layout { display: flex; height: 100%; }
  .sidebar { width: 340px; background: var(--panel); border-right: 1px solid #222d34;
    display: flex; flex-direction: column; }
  .side-header { padding: 14px 16px; background: var(--panel2);
    display: flex; align-items: center; justify-content: space-between; }
  .me { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .me:hover .name { color: var(--accent2); }
  .avatar.has-img { background-size: cover; background-position: center; color: transparent; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
  .me .name { font-weight: 600; font-size: 15px; }
  .logout { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; }
  .logout:hover { color: var(--text); }
  .search-box { padding: 10px 12px; }
  .search-box input { background: var(--panel2); border: none; }
  .chat-list { flex: 1; overflow-y: auto; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    cursor: pointer; border-bottom: 1px solid #182229; }
  .chat-item:hover, .chat-item.active { background: var(--panel2); }
  .chat-item .info { flex: 1; min-width: 0; }
  .chat-item .info .top { display: flex; justify-content: space-between; }
  .chat-item .uname { font-weight: 600; font-size: 15px; }
  .chat-item .preview { font-size: 13px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .time { font-size: 11px; color: var(--muted); }
  .badge { background: var(--accent2); color: #03251a; border-radius: 10px;
    font-size: 11px; font-weight: 700; padding: 1px 7px; }
  .empty-list { padding: 30px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .search-result-tag { font-size: 11px; color: var(--accent2); }
  .conversation { flex: 1; display: flex; flex-direction: column; background: #0b141a; }
  .conv-header { padding: 12px 18px; background: var(--panel2); display: flex; align-items: center; gap: 12px; }
  .conv-header .uname { font-weight: 600; font-size: 16px; }
  .conv-header .status { font-size: 12px; color: var(--muted); }
  .messages { flex: 1; overflow-y: auto; padding: 20px 8%; display: flex; flex-direction: column; gap: 6px; }
  .bubble { position: relative; max-width: 70%; padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
  .bubble .del { position: absolute; top: 2px; right: 5px; font-size: 12px; line-height: 1;
    color: rgba(255,255,255,.5); cursor: pointer; opacity: 0; transition: opacity .15s; }
  .bubble:hover .del { opacity: 1; }
  .bubble .del:hover { color: #ff6b6b; }
  @media (hover: none) { .bubble .del { opacity: .55; } }
  .conv-header .clickable { cursor: pointer; }
  .conv-header .clickable:hover .uname { color: var(--accent2); }
  .btn-delete { background: #b3261e; color: #fff; }
  .profile-row { display: flex; align-items: center; gap: 14px; }
  .modal-card input[type=file] { font-size: 13px; color: var(--muted); }
  .bubble .t { font-size: 10px; color: rgba(255,255,255,.5); margin-top: 3px; text-align: right; }
  .bubble.me { align-self: flex-end; background: var(--bubble-me); border-bottom-right-radius: 2px; }
  .bubble.them { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 2px; }
  .composer { padding: 12px 16px; background: var(--panel2); display: flex; gap: 10px; }
  .composer input { background: var(--panel); border: none; border-radius: 22px; padding: 12px 18px; }
  .composer button { width: 46px; height: 46px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 20px; cursor: pointer; flex-shrink: 0; }
  .composer button:hover { background: #029b78; }
  .composer .attach { width: 46px; height: 46px; border-radius: 50%; border: none;
    background: #2a3942; color: var(--text); font-size: 20px; cursor: pointer; flex-shrink: 0; }
  .composer .attach:hover { background: #33444d; }
  .chat-img { max-width: 240px; max-height: 280px; border-radius: 8px; display: block; cursor: pointer; }
  .bubble.img-bubble { padding: 4px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: flex;
    align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
  .lightbox img { max-width: 94vw; max-height: 94vh; border-radius: 6px; }
  .no-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--muted); gap: 12px; text-align: center; padding: 20px; }
  .no-chat .big { font-size: 22px; color: var(--text); }
  .new-group { padding: 0 12px 10px; }
  .new-group button { width: 100%; padding: 9px; border: none; border-radius: 8px;
    background: #2a3942; color: var(--text); font-size: 13px; cursor: pointer; }
  .new-group button:hover { background: #33444d; }
  .bubble .sender { font-size: 11px; color: var(--accent2); font-weight: 600; margin-bottom: 2px; }
  .ticks { color: rgba(255,255,255,.5); font-size: 11px; }
  .ticks.seen { color: #53bdeb; }
  .seenby { font-size: 11px; color: var(--muted); margin-top: 4px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 3px; }
  .av-wrap { position: relative; flex-shrink: 0; }
  .av-wrap .dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px;
    border-radius: 50%; background: #25d366; border: 2px solid var(--panel); }
  .status.online-text { color: var(--accent2); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal-card { width: 420px; max-width: 92vw; max-height: 85vh; background: var(--panel);
    border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .modal-card h3 { color: var(--accent2); }
  .modal-card .members { flex: 1; overflow-y: auto; border: 1px solid #2a3942;
    border-radius: 8px; max-height: 300px; }
  .member-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    cursor: pointer; border-bottom: 1px solid #182229; }
  .member-row:hover { background: var(--panel2); }
  .member-row input { width: auto; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button { padding: 10px 16px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-cancel { background: #2a3942; color: var(--text); }
  .btn-create { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a3942; border-radius: 4px; }
  .back-btn { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; }
  @media (max-width: 720px) {
    .sidebar { width: 100%; } .sidebar.hidden { display: none; }
    .conversation { position: fixed; inset: 0; } .conversation.hidden { display: none; }
    .back-btn { display: inline-block !important; }
  }
</style>
</head>
<body>

<div id="auth">
  <h1>WriteChat</h1>
  <p class="sub" id="authSub">Pick your own username and password to start.</p>
  <div class="field"><label>Username (your choice)</label>
    <input id="username" placeholder="e.g. nightowl" autocomplete="off"></div>
  <div class="field"><label>Password (your choice)</label>
    <input id="password" type="password" placeholder="your password"></div>
  <div class="field" id="inviteField"><label>Invite code</label>
    <input id="invite" placeholder="Code from your friend" autocomplete="off"></div>
  <button class="primary" id="authBtn">Sign up</button>
  <div class="msg-error" id="authError"></div>
  <div class="toggle" id="authToggle">Already have an account? <a id="toggleLink">Log in</a></div>
</div>

<div id="app">
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="side-header">
        <div class="me" id="meBtn" title="Your profile"><div class="avatar" id="myAvatar"></div><div class="name" id="myName"></div></div>
        <button class="logout" id="logoutBtn">Log out</button>
      </div>
      <div class="search-box"><input id="searchInput" placeholder="Search a friend's username…" autocomplete="off"></div>
      <div class="new-group" id="newGroupWrap" style="display:none"><button id="newGroupBtn">＋ New group</button></div>
      <div class="new-group" id="codePanelWrap" style="display:none;padding-top:0"><button id="codePanelBtn">🎟️ Einladungscodes</button></div>
      <div class="new-group" id="ownerPanelWrap" style="display:none;padding-top:0"><button id="ownerPanelBtn">⚙️ Owner-Panel</button></div>
      <div class="chat-list" id="chatList"></div>
    </div>
    <div class="conversation" id="conversation"></div>
  </div>
</div>

<script>
/* ===== WriteChat client — talks to the Netlify function at /api ===== */
const ENDPOINT = "/api";   // Netlify routes this to the serverless function

let token = null, myKey = null, myName = null;
let openChatWith = null, openChatName = null;
let partners = {};         // otherKey -> {ts,last,name,from}
let lastRead = {};
let pollTimer = null, isLoginMode = false;
let lastThreadJSON = "";
let authFails = 0;
let announcements = [], isAdmin = false;
let groups = {};                // groupId -> {name, ts, last, from}
let avatarCache = {};           // userKey -> dataURL string, or null if none
let avatarPending = {};         // userKey -> true while fetching
const ANN = "@announcements";   // special id for the announcements channel
const isGroupId = id => typeof id === "string" && id.startsWith("g_");
const MEDIA_PREFIX = "\u0001img:";   // a message whose text is this + media-id is a photo
let mediaCache = {};            // mediaId -> dataURL
let mediaPending = {};          // mediaId -> true while fetching
const isImageMsg = t => typeof t === "string" && t.startsWith(MEDIA_PREFIX);
function previewText(t) {
  if (!t) return "";
  const i = t.indexOf(MEDIA_PREFIX);
  if (i === 0) return "📷 Foto";
  if (i > 0) return t.slice(0, i) + "📷 Foto";   // group form "Name: <marker>"
  return t;
}
let presence = {}, readsMap = {}, annReaders = null, serverNow = Date.now(), touchedAt = 0;
let groupMembers = [];
let lastListSig = "";   // skip re-drawing the sidebar unless something changed

function isOnline(ts) { return ts && (serverNow - ts) < 20000; }
function lastActive(ts) {
  if (!ts) return "offline";
  const d = serverNow - ts;
  if (d < 20000) return "online";
  const m = Math.floor(d / 60000);
  if (m < 1) return "zuletzt online: gerade eben";
  if (m < 60) return `zuletzt online vor ${m} Min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `zuletzt online vor ${h} Std`;
  return `zuletzt online vor ${Math.floor(h / 24)} Tg`;
}
async function markSeenCurrent() {
  if (!openChatWith) return;
  let scope, id = "";
  if (openChatWith === ANN) scope = "ann";
  else if (isGroupId(openChatWith)) { scope = "group"; id = openChatWith; }
  else { scope = "dm"; id = openChatWith; }
  try { await api("markseen", { token, scope, id }); } catch { /* ignore */ }
}

/* ---- avatars ---- */
function avatarDiv(key, display) {
  if (avatarCache[key]) {
    return `<div class="avatar has-img" data-akey="${key}" style="background-image:url('${avatarCache[key]}')">${initials(display || key)}</div>`;
  }
  ensureAvatar(key);
  return `<div class="avatar" data-akey="${key}">${initials(display || key)}</div>`;
}
function applyAvatar(el, key, display) {
  if (!el) return;
  if (avatarCache[key]) {
    el.classList.add("has-img");
    el.style.backgroundImage = `url('${avatarCache[key]}')`;
  } else {
    el.classList.remove("has-img");
    el.style.backgroundImage = "";
    ensureAvatar(key);
  }
  el.textContent = initials(display || key);
}
async function ensureAvatar(key) {
  if (key in avatarCache || avatarPending[key]) return;
  avatarPending[key] = true;
  try { avatarCache[key] = (await api("getavatar", { token, user: key })).image || null; }
  catch { avatarCache[key] = null; }
  avatarPending[key] = false;
  if (!avatarCache[key]) return;               // nothing to show, no refresh needed
  document.querySelectorAll(`.avatar[data-akey="${key}"]`).forEach(el => {
    el.classList.add("has-img");
    el.style.backgroundImage = `url('${avatarCache[key]}')`;
  });
}
function resizeImage(file, size) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = size; c.height = size;
        const ctx = c.getContext("2d");
        const min = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, size, size);
        resolve(c.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function resizePhoto(file, maxDim) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function ensureMedia(id) {
  if (id in mediaCache || mediaPending[id]) return;
  mediaPending[id] = true;
  try { mediaCache[id] = (await api("getmedia", { token, id })).image || null; }
  catch { mediaCache[id] = null; }
  mediaPending[id] = false;
  if (!mediaCache[id]) return;
  document.querySelectorAll(`img.chat-img[data-mid="${id}"]`).forEach(el => { el.src = mediaCache[id]; });
}
function mediaImgTag(id) {
  ensureMedia(id);
  const src = mediaCache[id];
  return `<img class="chat-img" data-mid="${id}" ${src ? `src="${src}"` : ""} alt="Foto">`;
}
function openLightbox(src) {
  if (!src) return;
  const lb = document.createElement("div");
  lb.className = "lightbox";
  lb.innerHTML = `<img src="${src}" alt="Foto">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}
function wireChatImages(box) {
  box.querySelectorAll("img.chat-img").forEach(el => {
    el.onclick = () => openLightbox(el.src || mediaCache[el.dataset.mid]);
  });
}

const $ = id => document.getElementById(id);
const norm = s => s.trim().toLowerCase();
const initials = n => n.slice(0, 2).toUpperCase();
const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const fmtDateTime = ts => { const d = new Date(ts); return d.toLocaleDateString("de-DE") + ", " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
const escapeHtml = s => String(s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

async function api(action, extra) {
  const res = await fetch(ENDPOINT, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ action, ...extra }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

async function sendPhotoFile(file, sendFn) {
  if (!file) return;
  if (!file.type || !file.type.startsWith("image/")) { alert("Bitte ein Bild auswählen."); return; }
  try {
    const data = await resizePhoto(file, 1024);
    const r = await api("uploadmedia", { token, image: data });
    mediaCache[r.id] = data;               // show instantly without a re-fetch
    await sendFn(MEDIA_PREFIX + r.id);
    markRead(openChatWith);
    await poll();
  } catch (e) { alert(e.message || "Bild konnte nicht gesendet werden."); }
}

/* ---- auth ---- */
function setMode(login) {
  isLoginMode = login;
  $("authBtn").textContent = login ? "Log in" : "Sign up";
  $("authSub").textContent = login ? "Welcome back — log in to keep writing."
                                   : "Pick your own username and password to start.";
  $("authToggle").innerHTML = login
    ? `New here? <a id="toggleLink">Create an account</a>`
    : `Already have an account? <a id="toggleLink">Log in</a>`;
  $("toggleLink").onclick = () => setMode(!isLoginMode);
  $("inviteField").style.display = login ? "none" : "block";  // code only for sign-up
  $("authError").textContent = "";
}
setMode(false);

$("authBtn").onclick = async () => {
  const uname = $("username").value.trim(), pass = $("password").value;
  $("authError").textContent = "";
  if (!uname || !pass) { $("authError").textContent = "Enter a username and password."; return; }
  if (!isLoginMode && !$("invite").value.trim()) { $("authError").textContent = "Enter an invite code."; return; }
  $("authBtn").disabled = true;
  try {
    const body = isLoginMode
      ? { username: uname, password: pass }
      : { username: uname, password: pass, code: $("invite").value };
    const data = await api(isLoginMode ? "login" : "register", body);
    beginSession(data.token, data.username, data.key);
  } catch (e) { $("authError").textContent = e.message; }
  finally { $("authBtn").disabled = false; }
};

function beginSession(t, display, key) {
  token = t; myName = display; myKey = key || norm(display);
  localStorage.setItem("wc_token", t);
  localStorage.setItem("wc_name", display);
  localStorage.setItem("wc_key", myKey);
  try { lastRead = JSON.parse(localStorage.getItem("wc_read_" + myKey) || "{}"); } catch { lastRead = {}; }
  $("username").value = ""; $("password").value = ""; if ($("invite")) $("invite").value = "";
  $("auth").style.display = "none";
  $("app").style.display = "block";
  $("myName").textContent = display;
  $("myAvatar").textContent = initials(display);
  openChatWith = null; partners = {}; groups = {};
  $("newGroupWrap").style.display = "none";
  renderConversation();
  poll();
  scheduleNext();
}

$("logoutBtn").onclick = () => {
  clearTimeout(pollTimer);
  localStorage.removeItem("wc_token"); localStorage.removeItem("wc_name"); localStorage.removeItem("wc_key");
  token = null; myKey = null; openChatWith = null;
  $("app").style.display = "none"; $("auth").style.display = "block"; setMode(false);
};

/* ---- polling ---- */
async function poll() {
  try {
    let chatWith = "", groupWith = "";
    if (openChatWith && openChatWith !== ANN) {
      if (isGroupId(openChatWith)) groupWith = openChatWith; else chatWith = openChatWith;
    }
    const touch = (Date.now() - touchedAt) > 5000;
    if (touch) touchedAt = Date.now();
    const data = await api("sync", { token, chatWith, groupWith, touch });
    partners = data.partners || {};
    announcements = data.announcements || [];
    groups = data.groups || {};
    isAdmin = !!data.isAdmin;
    presence = data.presence || {};
    readsMap = data.reads || {};
    annReaders = data.annReaders || null;
    serverNow = data.now || Date.now();
    if (data.me && data.me !== myKey) { myKey = data.me; localStorage.setItem("wc_key", myKey); }
    if (data.meName && data.meName !== myName) {   // owner renamed me → reflect it everywhere
      myName = data.meName;
      localStorage.setItem("wc_name", myName);
      lastListSig = "";
    }
    $("newGroupWrap").style.display = isAdmin ? "block" : "none";
    $("codePanelWrap").style.display = isAdmin ? "block" : "none";
    $("ownerPanelWrap").style.display = isAdmin ? "block" : "none";
    $("myName").textContent = isAdmin ? myName + " (owner)" : myName;
    applyAvatar($("myAvatar"), myKey, myName);
    renderChatList();
    if (openChatWith === ANN) renderAnnouncements(announcements);
    else if (isGroupId(openChatWith)) renderGroup(data.groupMessages || [], data.groupMeta);
    else if (openChatWith) {
      renderThread(data.messages || []);
      const st = $("dmStatus");
      if (st) { st.textContent = lastActive(presence[openChatWith]); st.classList.toggle("online-text", isOnline(presence[openChatWith])); }
    }
    authFails = 0;
  } catch (e) {
    // only log out after repeated auth failures, not a single transient blip
    if (String(e.message).toLowerCase().includes("logged in")) {
      if (++authFails >= 3) $("logoutBtn").onclick();
    }
  }
}

// Adaptive polling — saves Netlify usage. Fast only when actively in a chat,
// slow on the list, paused when the tab is hidden.
function pollDelay() {
  if (document.hidden) return 30000;     // tab in background: barely poll
  if (openChatWith) return 2000;         // actively viewing a chat
  return 6000;                           // just on the chat list
}
async function pollLoop() {
  if (!token) return;
  await poll();
  scheduleNext();
}
function scheduleNext() {
  clearTimeout(pollTimer);
  if (!token) return;
  pollTimer = setTimeout(pollLoop, pollDelay());
}
function startPolling() { poll().then(scheduleNext); }
// poll right away when the user comes back to the tab
document.addEventListener("visibilitychange", () => { if (!document.hidden && token) startPolling(); });

function markRead(key) {
  lastRead[key] = Date.now() + 5000;

async function renderChatList() {
  const list = $("chatList");
  const q = $("searchInput").value.trim();
  if (q) {
    lastListSig = "";   // force a fresh redraw once search is cleared
    let users = [];
    try { users = (await api("search", { token, q })).users; } catch {}
    list.innerHTML = "";
    if (!users.length) {
      list.innerHTML = `<div class="empty-list">No user found for “${escapeHtml(q)}”.<br>Check the spelling, or ask them to sign up.</div>`;
      return;
    }
    users.forEach(u => list.appendChild(chatItem(u.key, u.display, "Tap to start writing", null, 0, true)));
    return;
  }
  // merge direct chats and groups into one list, newest first
  const items = [];
  for (const k of Object.keys(partners)) items.push({ kind: "dm", key: k, ...partners[k] });
  for (const id of Object.keys(groups)) items.push({ kind: "group", key: id, ...groups[id] });
  items.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  // only rebuild the DOM when something visible actually changed (stops flicker)
  const latestAnn = announcements.length ? announcements[announcements.length - 1] : null;
  const sig = JSON.stringify(items.map(it => [
    it.kind, it.key, it.name, it.last, it.ts,
    it.kind === "dm" ? (isOnline(presence[it.key]) ? 1 : 0) : 0,
    it.kind === "dm" && it.from === it.key && (it.ts || 0) > (lastRead[it.key] || 0) ? 1 : 0,
    it.kind === "group" ? groupUnread(it) : 0,
  ])) + "|ann:" + (latestAnn ? latestAnn.text + latestAnn.ts : "none") + "|annu:" + annUnread() + "|open:" + openChatWith;
  if (sig === lastListSig) return;
  lastListSig = sig;
  list.innerHTML = "";
  list.appendChild(announcementItem());   // always pinned at the very top
  if (!items.length) {
    const e = document.createElement("div");
    e.className = "empty-list";
    e.innerHTML = "No chats yet.<br>Search a friend's username above to write to them.";
    list.appendChild(e);
    return;
  }
  for (const it of items) {
    if (it.kind === "group") {
      list.appendChild(groupItem(it, groupUnread(it)));
    } else {
      const unread = (it.from === it.key && (it.ts || 0) > (lastRead[it.key] || 0)) ? 1 : 0;
      list.appendChild(chatItem(it.key, it.name || it.key, previewText(it.last || ""), it.ts, unread, false));
    }
  }
}

        <span style="margin-left:auto;display:flex;gap:8px">
          <button class="btn-cancel" data-copy="${escapeHtml(c.code)}" style="padding:4px 10px;font-size:12px">Kopieren</button>
          <button class="btn-delete" data-del="${escapeHtml(c.code)}" style="padding:4px 10px;font-size:12px">✕</button>
        </span>`;
      listEl.appendChild(row);
    }
    head(`Benutzt (${used.length})`);
    for (const c of used) {
      const row = document.createElement("div");
      row.className = "member-row";
      row.innerHTML = `<b style="font-family:monospace;font-size:14px;opacity:.6;text-decoration:line-through">${escapeHtml(c.code)}</b>
        <span style="margin-left:auto;font-size:12px;color:var(--muted)">benutzt von ${escapeHtml(c.usedName || c.usedBy)}</span>`;
      listEl.appendChild(row);
    }
    listEl.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Kopiert ✓"; setTimeout(() => b.textContent = "Kopieren", 1200); }
      catch { prompt("Code kopieren:", b.dataset.copy); }
    });
    listEl.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if (!confirm(`Code "${b.dataset.del}" löschen?`)) return;
      try { await api("delcode", { token, code: b.dataset.del }); refresh(); }
      catch (e) { alert(e.message); }
    });
  }
  refresh();

  overlay.querySelector("#genBtn").onclick = async () => {
    const custom = overlay.querySelector("#customCode").value.trim();
    try {
      const r = await api("gencode", { token, code: custom });
      overlay.querySelector("#customCode").value = "";
      await refresh();
      try { await navigator.clipboard.writeText(r.code); } catch {}
      alert(`Code erstellt: ${r.code}\n(schon in die Zwischenablage kopiert)`);
    } catch (e) { alert(e.message); }
  };
}

/* ---- owner panel (stats + media reset) ---- */
async function openOwnerPanel() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-card">
      <h3>⚙️ Owner-Panel</h3>
      <div style="background:var(--panel2);border-radius:10px;padding:14px">
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Speicher</div>
        <div id="ownerStats" style="font-size:14px">Lädt…</div>
        <div style="height:8px;background:#0b141a;border-radius:5px;overflow:hidden;margin-top:10px">
          <div id="ownerBar" style="height:100%;width:0%;background:var(--accent);transition:width .3s"></div>
        </div>
      </div>
      <button class="btn-delete" id="ownerClearBtn" style="width:100%;padding:11px;border:none;border-radius:8px;font-weight:600;cursor:pointer">🗑️ Alle Chat-Fotos löschen (Reset)</button>
      <div style="font-size:12px;color:var(--muted)">Löscht alle Fotos aus allen Chats & Gruppen. Texte bleiben. Macht den Speicher wieder frei.</div>
      <div class="modal-actions">
        <button class="btn-cancel" id="ownerClose">Close</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector("#ownerClose").onclick = () => overlay.remove();

  const statsEl = overlay.querySelector("#ownerStats");
  const barEl = overlay.querySelector("#ownerBar");
  async function loadStats() {
    try {
      const s = await api("mediastats", { token });
      const mb = s.bytes / 1024 / 1024;
      const pct = Math.min(100, (s.bytes / (5 * 1024 * 1024 * 1024)) * 100);
      statsEl.innerHTML = `📷 <b>${s.count}</b> Fotos insgesamt<br>${mb < 1 ? (s.bytes / 1024).toFixed(0) + " KB" : mb.toFixed(1) + " MB"} von 5 GB belegt (${pct.toFixed(pct < 1 ? 2 : 1)}%)`;
      barEl.style.width = Math.max(pct, pct > 0 ? 1 : 0) + "%";
      barEl.style.background = pct > 85 ? "#b3261e" : "var(--accent)";
    } catch (e) { statsEl.textContent = "Statistik nicht verfügbar: " + e.message; }
  }
  loadStats();

  const clearBtn = overlay.querySelector("#ownerClearBtn");
  clearBtn.onclick = async () => {
    if (!confirm("ALLE Fotos aus ALLEN Chats & Gruppen löschen? Texte bleiben erhalten. Das kann nicht rückgängig gemacht werden.")) return;
    if (!confirm("Wirklich sicher? Danach sind alle Bilder weg und der Speicher ist frei.")) return;
    clearBtn.disabled = true; clearBtn.textContent = "Lösche…";
    try {
      const r = await api("clearmedia", { token });
      mediaCache = {}; mediaPending = {};
      lastThreadJSON = ""; lastListSig = "";
      await poll();
      await loadStats();
      alert(`✅ ${r.removed} Fotos gelöscht. Speicher ist wieder frei.`);
    } catch (e) { alert(e.message); }
    finally { clearBtn.disabled = false; clearBtn.textContent = "🗑️ Alle Chat-Fotos löschen (Reset)"; }
  };
}

/* ---- profile (own) ---- */
function openProfileModal() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const cur = avatarCache[myKey];
  overlay.innerHTML = `
    <div class="modal-card">
      <h3>Your profile</h3>
      <div class="profile-row">
        <div class="avatar ${cur ? "has-img" : ""}" id="profilePreview" style="width:72px;height:72px;font-size:26px;${cur ? `background-image:url('${cur}')` : ""}">${initials(myName)}</div>
        <div>
          <div style="font-weight:600" id="profName">${escapeHtml(myName)}${isAdmin ? " (owner)" : ""}</div>
          <div style="color:var(--muted);font-size:13px">Login: @${escapeHtml(myKey)}</div>
        </div>
      </div>
      <label style="font-size:13px;color:var(--muted)">Anzeige-Name (Login @${escapeHtml(myKey)} bleibt gleich):</label>
      <div style="display:flex;gap:8px">
        <input id="nameInput" maxlength="24" value="${escapeHtml(myName)}" placeholder="Dein Name">
        <button class="btn-create" id="nameSave" style="white-space:nowrap">Name</button>
      </div>
      <label style="font-size:13px;color:var(--muted)">Profilbild hochladen:</label>
      <input type="file" id="avatarFile" accept="image/*">
      <div class="modal-actions">
        <button class="btn-delete" id="profDelPhoto">Foto entfernen</button>
        <button class="btn-cancel" id="profCancel">Close</button>
        <button class="btn-create" id="profSave" disabled>Save photo</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector("#profDelPhoto").onclick = async () => {
    if (!confirm("Dein Profilbild entfernen?")) return;
    try {
      await api("deleteavatar", { token });
      avatarCache[myKey] = null;
      applyAvatar($("myAvatar"), myKey, myName);
      const p = overlay.querySelector("#profilePreview");
      if (p) { p.classList.remove("has-img"); p.style.backgroundImage = ""; p.textContent = initials(myName); }
      lastListSig = "";
      renderChatList();
    } catch (e) { alert(e.message); }
  };
  overlay.querySelector("#nameSave").onclick = async () => {
    const name = overlay.querySelector("#nameInput").value.trim();
    if (!name) { alert("Gib einen Namen ein."); return; }
    try {
      const r = await api("setname", { token, name });
      myName = r.name;
      localStorage.setItem("wc_name", myName);
      $("myName").textContent = isAdmin ? myName + " (owner)" : myName;
      overlay.querySelector("#profName").textContent = myName + (isAdmin ? " (owner)" : "");
      lastListSig = "";
      renderChatList();
      alert("Name geändert! Du bleibst weiterhin Owner. 👑");
    } catch (e) { alert(e.message); }
  };
  let pending = null;
  overlay.querySelector("#avatarFile").onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      pending = await resizeImage(file, 256);
      const p = overlay.querySelector("#profilePreview");
      p.classList.add("has-img");
      p.style.backgroundImage = `url('${pending}')`;
      overlay.querySelector("#profSave").disabled = false;
    } catch { alert("Couldn't read that image."); }
  };
  overlay.querySelector("#profCancel").onclick = () => overlay.remove();
  overlay.querySelector("#profSave").onclick = async () => {
    if (!pending) return;
    try {
      await api("setavatar", { token, image: pending });
      avatarCache[myKey] = pending;
      applyAvatar($("myAvatar"), myKey, myName);
      renderChatList();
      overlay.remove();
    } catch (e) { alert(e.message); }
  };
}

/* ---- profile (another user) ---- */
function openUserProfile(key, display) {
  ensureAvatar(key);
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const cur = avatarCache[key];
  const canDelete = isAdmin && key !== myKey;
  overlay.innerHTML = `
    <div class="modal-card">
      <h3>Profile</h3>
      <div class="profile-row">
        <div class="avatar ${cur ? "has-img" : ""}" style="width:72px;height:72px;font-size:26px;${cur ? `background-image:url('${cur}')` : ""}">${initials(display)}</div>
        <div>
          <div style="font-weight:600">${escapeHtml(display)}</div>
          ${isAdmin ? `<div style="color:var(--muted);font-size:13px">@${escapeHtml(key)}</div>` : ""}
          <div class="${isOnline(presence[key]) ? "online-text" : ""}" style="font-size:13px;${isOnline(presence[key]) ? "" : "color:var(--muted)"}">${lastActive(presence[key])}</div>
        </div>
      </div>
      ${isAdmin && key !== myKey ? `
      <label style="font-size:13px;color:var(--muted)">Anzeige-Name ändern (als Owner):</label>
      <div style="display:flex;gap:8px">
        <input id="renInput" maxlength="24" value="${escapeHtml(display)}">
        <button class="btn-create" id="renSave" style="white-space:nowrap">Name</button>
      </div>
      <label style="font-size:13px;color:var(--muted)">Profilbild (als Owner):</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="file" id="otherAvatarFile" accept="image/*" style="flex:1">
        <button class="btn-delete" id="otherDelPhoto" style="white-space:nowrap">Foto entfernen</button>
      </div>` : ""}
      <div class="modal-actions">
        ${canDelete ? `<button class="btn-delete" id="delUser">Delete account</button>` : ""}
        <button class="btn-cancel" id="profClose">Close</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector("#profClose").onclick = () => overlay.remove();
  if (isAdmin && key !== myKey) {
    overlay.querySelector("#renSave").onclick = async () => {
      const name = overlay.querySelector("#renInput").value.trim();
      if (!name) { alert("Gib einen Namen ein."); return; }
      try {
        const r = await api("renameuser", { token, user: key, name });
        if (openChatWith === key) openChatName = r.name;
        lastListSig = "";
        renderChatList();
        if (openChatWith === key) renderConversation();
        overlay.remove();
        alert(`Name geändert zu "${r.name}".`);
      } catch (e) { alert(e.message); }
    };
    overlay.querySelector("#otherAvatarFile").onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const img = await resizeImage(file, 256);
        await api("setavatar", { token, user: key, image: img });
        avatarCache[key] = img;
        applyAvatar(overlay.querySelector(".avatar"), key, display);
        lastListSig = "";
        renderChatList();
        if (openChatWith === key) renderConversation();
        alert("Profilbild geändert. 📸");
      } catch (err) { alert(err.message || "Bild konnte nicht geladen werden."); }
    };
    overlay.querySelector("#otherDelPhoto").onclick = async () => {
      if (!confirm(`Profilbild von "${display}" entfernen?`)) return;
      try {
        await api("deleteavatar", { token, user: key });
        avatarCache[key] = null;
        applyAvatar(overlay.querySelector(".avatar"), key, display);
        lastListSig = "";
        renderChatList();
        if (openChatWith === key) renderConversation();
      } catch (err) { alert(err.message); }
    };
  }
  if (canDelete) {
    overlay.querySelector("#delUser").onclick = async () => {
      if (!confirm(`Delete the account "${display}" permanently? This can't be undone.`)) return;
      try {
        await api("deleteuser", { token, user: key });
        overlay.remove();
        openChatWith = null;
        renderConversation();
        await poll();
      } catch (e) { alert(e.message); }
    };
  }
}

/* ---- conversation ---- */
function renderConversation() {
  const conv = $("conversation");
  if (!openChatWith) {
    conv.classList.add("hidden"); $("sidebar").classList.remove("hidden");
    conv.innerHTML = `<div class="no-chat"><div class="big">Select or search a friend</div>
      <div>Find someone by their username and start writing.</div></div>`;
    return;
  }
  if (openChatWith === ANN) { renderAnnouncementsView(); return; }
  if (isGroupId(openChatWith)) { renderGroupView(); return; }
  const display = openChatName || openChatWith;
  conv.innerHTML = `
    <div class="conv-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="clickable" id="dmProfile" style="display:flex;align-items:center;gap:12px">
        ${avatarDiv(openChatWith, display)}
        <div><div class="uname">${escapeHtml(display)}</div><div class="status ${isOnline(presence[openChatWith]) ? "online-text" : ""}" id="dmStatus">${lastActive(presence[openChatWith])}</div></div>
      </div>
    </div>
    <div class="messages" id="messages"><div style="margin:auto;color:var(--muted);font-size:13px">Loading…</div></div>
    <div class="composer">
      <button class="attach" id="attachBtn" title="Foto senden">📎</button>
      <input type="file" id="photoInput" accept="image/*" style="display:none">
      <input id="msgInput" placeholder="Write a message…" autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>`;
  const prof = $("dmProfile");
  if (prof) prof.onclick = () => openUserProfile(openChatWith, display);
  $("attachBtn").onclick = () => $("photoInput").click();
  $("photoInput").onchange = e => { const f = e.target.files[0]; e.target.value = ""; sendPhotoFile(f, text => api("send", { token, to: openChatWith, text })); };

  const input = $("msgInput");
  const send = async () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    try { await api("send", { token, to: openChatWith, text }); markRead(openChatWith); await poll(); }
    catch (e) { alert(e.message); input.value = text; }
  };
  $("sendBtn").onclick = send;
  input.onkeydown = e => { if (e.key === "Enter") send(); };
  const back = $("backBtn");
  if (back) back.onclick = () => { openChatWith = null; renderConversation(); renderChatList(); };
  input.focus();
}

function renderThread(msgs) {
  const box = $("messages");
  if (!box) return;
  const sig = JSON.stringify(msgs.map(m => [m.ts, m.from, m.text])) + "|r" + (readsMap[openChatWith] || 0);
  if (sig === lastThreadJSON) return;   // nothing changed, don't disrupt scroll
  lastThreadJSON = sig;
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  if (!msgs.length) {
    box.innerHTML = `<div style="margin:auto;color:var(--muted);font-size:13px">No messages yet. Say hi 👋</div>`;
    return;
  }
  box.innerHTML = "";
  for (const m of msgs) {
    const mine = m.from === myKey;
    const canDel = mine || isAdmin;
    const seen = (readsMap[openChatWith] || 0) >= m.ts;
    const ticks = mine ? ` <span class="ticks ${seen ? "seen" : ""}">${seen ? "✓✓" : "✓"}</span>` : "";
    const img = isImageMsg(m.text);
    const content = img ? mediaImgTag(m.text.slice(MEDIA_PREFIX.length)) : escapeHtml(m.text);
    const b = document.createElement("div");
    b.className = "bubble " + (mine ? "me" : "them") + (img ? " img-bubble" : "");
    b.innerHTML = `${content}<div class="t">${fmtDateTime(m.ts)}${ticks}</div>${canDel ? `<span class="del" title="Delete">✕</span>` : ""}`;
    if (canDel) b.querySelector(".del").onclick = () => deleteDM(m.ts);
    box.appendChild(b);
  }
  wireChatImages(box);
  if (nearBottom) box.scrollTop = box.scrollHeight;
  markRead(openChatWith);
  markSeenCurrent();
}

async function deleteDM(ts) {
  if (!confirm("Delete this message?")) return;
  try { await api("deletemsg", { token, to: openChatWith, ts }); await poll(); }
  catch (e) { alert(e.message); }
}

/* ---- restore session ---- */
(function init() {
  const t = localStorage.getItem("wc_token"), n = localStorage.getItem("wc_name"), k = localStorage.getItem("wc_key");
  if (t && n) beginSession(t, n, k);
})();
</script>
